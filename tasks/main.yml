---
- name: Verify restic is installed at the configured path
  ansible.builtin.command: "{{ cr_synology_backup_restic_binary }} version"
  register: _restic_version
  changed_when: false
  check_mode: false
  failed_when: _restic_version.rc != 0

- name: Ensure base directory exists
  ansible.builtin.file:
    path: "{{ cr_synology_backup_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ cr_synology_backup_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Ensure restic cache directory exists on /volume1
  ansible.builtin.file:
    path: "{{ cr_synology_backup_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure restic tmp directory exists on /volume1
  ansible.builtin.file:
    path: "{{ cr_synology_backup_tmp_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Remove orphaned restic cache on rootfs
  # DSM's rootfs is ~2.3 GB; a partial cache from a pre-RESTIC_CACHE_DIR
  # run will have pinned it at 100% and must be cleared before the wrapper
  # can succeed. Safe to run unconditionally — restic will rebuild under
  # RESTIC_CACHE_DIR on the next backup.
  ansible.builtin.file:
    path: /root/.cache/restic
    state: absent

- name: Deploy SSH private key
  ansible.builtin.copy:
    content: "{{ cr_synology_backup_ssh_private_key }}"
    dest: "{{ cr_synology_backup_ssh_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy restic repository password file
  ansible.builtin.copy:
    content: "{{ cr_synology_backup_repo_password }}"
    dest: "{{ cr_synology_backup_repo_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render restic backup wrapper script
  ansible.builtin.template:
    src: restic-backup-to-harvest.sh.j2
    dest: "{{ cr_synology_backup_script_path }}"
    owner: root
    group: root
    mode: "0700"
