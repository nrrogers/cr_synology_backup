---
# cr_synology_backup defaults.
#
# Required variables (no default — must be set per host, typically in host_vars):
#
#   cr_synology_backup_repo_url           - Full restic SFTP URL including per-host subdir
#   cr_synology_backup_ssh_target_host    - IP or hostname for the SFTP connection
#   cr_synology_backup_repo_password      - restic repo password (vault me)
#   cr_synology_backup_ssh_private_key    - SSH private key contents (vault me)
#   cr_synology_backup_healthcheck_url    - Full healthcheck.io ping URL (vault me)
#   cr_synology_backup_paths              - List of absolute paths to back up
#

# --- file locations ---
cr_synology_backup_base_dir: /volume1/docker/scripts
cr_synology_backup_script_path: "{{ cr_synology_backup_base_dir }}/restic-backup-to-harvest.sh"
cr_synology_backup_ssh_key_path: "{{ cr_synology_backup_base_dir }}/restic_backup_id_ed25519"
cr_synology_backup_repo_password_file: "{{ cr_synology_backup_base_dir }}/.restic-password-{{ inventory_hostname }}"
cr_synology_backup_log_dir: "{{ cr_synology_backup_base_dir }}/logs"

# --- restic binary ---
# DSM's non-interactive shell PATH does not include /usr/local/bin where
# SynoCommunity symlinks restic, so the wrapper and the preflight check
# both invoke restic by absolute path. Override per-host if your install
# is elsewhere.
cr_synology_backup_restic_binary: /usr/local/bin/restic

# --- ssh ---
cr_synology_backup_ssh_user: svc_restic

# --- healthcheck.io ---
# `cr_synology_backup_healthcheck_url` is required (no default) and should be
# the full ping URL including the UUID, e.g. "https://hc-ping.com/abc-123-...".
# Stored in vault. Mirrors how autorestic-managed Docker hosts store theirs.
#
# `location_name` is a short identifier used in success/failure ping bodies:
#   "Backup successful for location: proteus"
# Defaults to the inventory hostname; override per-host if you want a different
# label in the healthchecks dashboard.
cr_synology_backup_location_name: "{{ inventory_hostname }}"

# --- restic retention (passed to `restic forget --prune`) ---
cr_synology_backup_retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 12
  keep_yearly: 2

# --- exclude patterns (DSM cruft + the password file by default) ---
cr_synology_backup_excludes:
  - "**/.DS_Store"
  - "**/@eaDir"
  - "**/#recycle"
  - "**/Thumbs.db"
  - "{{ cr_synology_backup_repo_password_file }}"

# --- local log retention (days) ---
cr_synology_backup_log_retention_days: 30
